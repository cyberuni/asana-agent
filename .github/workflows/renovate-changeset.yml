name: renovate-changeset
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: renovate-changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]'
    steps:
      # Renovate labels the PR with the update type it computed, so the bump level
      # is read rather than re-derived. No label means the update touched no runtime
      # dependency and needs no release.
      - name: Read bump level from the PR labels
        id: level
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          level=$(jq -r '.[]' <<<"$LABELS" | grep -m1 '^changeset:' | cut -d: -f2 || true)
          echo "level=$level" >> "$GITHUB_OUTPUT"
          if [ -z "$level" ]; then
            echo "no changeset:* label; runtime dependencies untouched"
          fi

      # A push made with GITHUB_TOKEN does not re-trigger `pull_request`, so the
      # required checks would never re-run and the PR would stall in the merge queue.
      # The app token does re-trigger them.
      - uses: actions/create-github-app-token@v3
        if: steps.level.outputs.level != ''
        id: app-token
        with:
          app-id: ${{ secrets.AUTOFIX_APP_ID }}
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        if: steps.level.outputs.level != ''
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Write the changeset
        if: steps.level.outputs.level != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LEVEL: ${{ steps.level.outputs.level }}
        run: |
          set -euo pipefail

          # Scope the idempotency check to THIS PR's changeset. The repo normally
          # carries a backlog of unreleased changesets, so a "does any changeset
          # exist" test would skip every time and the generator would never fire.
          if [ -f ".changeset/renovate-${PR_NUMBER}.md" ]; then
            echo "changeset for PR ${PR_NUMBER} already present"
            exit 0
          fi

          # Only published packages get a release entry; private workspaces do not.
          # `|| true` throughout: grep exits 1 on no match, which is a normal outcome
          # here, not a failure.
          changed=$(gh pr diff "$PR_NUMBER" --name-only | grep -E '^packages/[^/]+/package\.json$' || true)

          names=''
          for f in $changed; do
            n=$(node -e '
              const p = require("node:path").resolve(process.argv[1]);
              const j = require(p);
              if (!j.private && j.name) console.log(j.name);
            ' "$f" || true)
            [ -n "$n" ] && names="${names}${n}"$'\n'
          done

          if [ -z "$names" ]; then
            echo "no published package changed; skipping changeset"
            exit 0
          fi

          {
            echo '---'
            while read -r n; do [ -n "$n" ] && echo "'$n': $LEVEL"; done <<<"$names"
            echo '---'
            echo
            echo "Update runtime dependencies."
          } > ".changeset/renovate-${PR_NUMBER}.md"

          cat ".changeset/renovate-${PR_NUMBER}.md"

      - name: Commit and push
        if: steps.level.outputs.level != ''
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .changeset
          git commit -m 'chore: add changeset for dependency update'
          git push
