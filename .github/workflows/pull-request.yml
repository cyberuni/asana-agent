name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  # The merge queue builds a temporary merge-group branch and looks for the required
  # contexts there. It fires neither `pull_request` nor `push`, so without this trigger
  # a queued PR waits forever on checks that never start.
  merge_group:
  # changesets opens the "Version Packages" PR with GITHUB_TOKEN, and GitHub
  # deliberately does not fire `pull_request` for token-authored PRs. The required
  # contexts would never report and the release PR could never merge. Running on
  # push to that branch produces the same check contexts on the same head SHA,
  # which is what the ruleset actually evaluates.
  push:
    branches: ['changeset-release/**']

# Cancel superseded runs on a PR, but never on a merge-group branch — cancelling
# there would stall the queue on a check that never reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@main
    permissions:
      contents: read
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true
      skip-codecov: true

  mcp-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cyberuni/gap-analysis check
