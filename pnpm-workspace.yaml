packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tools/*"
allowBuilds:
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - "@biomejs/biome"
  - esbuild
  - sharp

# hono reaches us only through @modelcontextprotocol/sdk, which is already on its
# latest release, so there is no upgrade path to the patched version. It is a runtime
# dependency of the published package, so these advisories ship to consumers.
# Drop this override once the SDK depends on a patched hono itself.
# GHSA-f23p-vx2j-j53r, GHSA-79qm-7rj5-m7r9, GHSA-54fx-42gc-7vw4, GHSA-8j4g-w8fx-2239
overrides:
  hono: '>=4.12.34'
